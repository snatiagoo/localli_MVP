name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  vitest:
    runs-on: ubuntu-latest

    env:
      # Placeholder, not a real database. lib/db/index.ts calls neon() at import
      # time, which throws if this is missing. Tests mock or never hit the DB.
      DATABASE_URL: postgresql://user:pass@localhost:5432/test

    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm vitest run
